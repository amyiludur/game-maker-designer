name: validate

on:
  push:
  pull_request:

jobs:
  schemas:
    name: Schemas & example game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate example documents against schemas
        run: npm run validate
